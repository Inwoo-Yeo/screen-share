<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화면 공유 + 채팅 (호스트 모드)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }

    /* 비디오 그리드 */
    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
      gap: 0.5rem;
      align-content: start;
    }
  </style>
</head>
<body class="bg-gray-900 text-white">

  <!-- ===== 1. 입장 화면 ===== -->
  <div id="join-screen" class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="bg-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
      <h1 class="text-2xl font-bold mb-1 text-center">📺 화면 공유 룸</h1>
      <p class="text-gray-400 text-sm text-center mb-6">소그룹 활동 + 호스트 모니터링</p>

      <label class="block text-sm text-gray-300 mb-1">세션 이름</label>
      <input id="sessionId" type="text" placeholder="예: math-class"
        class="w-full px-4 py-2 mb-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" />

      <label class="block text-sm text-gray-300 mb-1">닉네임</label>
      <input id="userName" type="text" placeholder="예: 홍길동"
        class="w-full px-4 py-2 mb-5 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" />

      <button id="joinAsParticipantBtn"
        class="w-full bg-blue-600 hover:bg-blue-500 transition py-3 rounded-lg font-semibold mb-2">
        참가자로 입장
      </button>

      <div class="border-t border-gray-700 my-4"></div>

      <details class="bg-gray-900/50 rounded-lg p-3" open>
        <summary class="cursor-pointer text-sm font-medium text-purple-400">
          👑 호스트로 시작 (방 만들기)
        </summary>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">방 개수</label>
            <input id="numRooms" type="number" min="1" max="20" value="9"
              class="w-full px-3 py-2 rounded bg-gray-700 border border-gray-600 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">방당 최대 인원</label>
            <input id="maxPerRoom" type="number" min="2" max="10" value="4"
              class="w-full px-3 py-2 rounded bg-gray-700 border border-gray-600 text-sm" />
          </div>
        </div>
        <button id="joinAsHostBtn"
          class="w-full bg-purple-600 hover:bg-purple-500 transition py-2 rounded-lg font-semibold text-sm mt-3">
          호스트로 시작
        </button>
        <p class="text-xs text-gray-500 mt-2">
          참가자보다 먼저 입장하면 방 개수/인원 설정이 적용됩니다.
        </p>
      </details>
    </div>
  </div>

  <!-- ===== 2. 방 선택/대시보드 화면 ===== -->
  <div id="grid-screen" class="hidden min-h-screen p-4">
    <div class="max-w-6xl mx-auto">
      <header class="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div>
          <h2 class="text-xl font-bold flex items-center gap-2">
            <span id="gridTitle">방 선택</span>
            <span id="hostBadge" class="hidden text-xs bg-purple-600 px-2 py-0.5 rounded">👑 HOST</span>
          </h2>
          <p class="text-sm text-gray-400">
            세션: <span id="gridSessionId" class="font-mono"></span>
            · 닉네임: <span id="gridUserName"></span>
          </p>
        </div>
        <button id="exitSessionBtn" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm">
          세션 나가기
        </button>
      </header>

      <div id="hostHint" class="hidden bg-purple-900/30 border border-purple-700 rounded-lg p-3 mb-4 text-sm">
        💡 <b>호스트 가이드:</b> 아래에서 들어가고 싶은 방을 선택하면 학생들 사이로 들어가 모니터링할 수 있어요.
        방을 나가면 다른 방으로 이동할 수 있고, 한 번에 한 방만 들어갈 수 있어요.
      </div>

      <div id="roomGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
    </div>
  </div>

  <!-- ===== 3. 미팅 화면 ===== -->
  <div id="meeting-screen" class="hidden h-screen flex-col">
    <header class="bg-gray-800 px-4 py-3 flex items-center justify-between border-b border-gray-700">
      <div class="flex items-center gap-3 flex-wrap">
        <button id="backToGridBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">
          ← 방 목록
        </button>
        <span class="font-semibold" id="currentRoomLabel"></span>
        <span class="text-gray-500 text-xs">(<span id="userCount">1</span>명)</span>
        <span id="meetingHostBadge" class="hidden text-xs bg-purple-600 px-2 py-0.5 rounded">👑 HOST</span>
      </div>
      <button id="leaveBtn" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm">
        세션 나가기
      </button>
    </header>

    <div class="flex-1 flex overflow-hidden flex-col md:flex-row">
      <main class="flex-1 flex flex-col bg-black min-h-0">
        <!-- 비디오 영역 + placeholder -->
        <div class="flex-1 relative">
          <div id="videos" class="absolute inset-0 overflow-auto p-2"></div>
          <div id="placeholder" class="absolute inset-0 flex items-center justify-center text-gray-500 pointer-events-none">
            <div class="text-center">
              <div class="text-5xl mb-2">🖥️</div>
              <p>아직 공유 중인 화면이 없습니다.</p>
              <p class="text-sm mt-1">아래 [화면 공유] 버튼을 눌러 시작하세요.</p>
            </div>
          </div>
        </div>

        <div class="bg-gray-800 px-4 py-3 flex items-center justify-center gap-3 border-t border-gray-700">
          <button id="shareBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg flex items-center gap-2 transition">
            <span>🖥️</span><span id="shareLabel">화면 공유</span>
          </button>
          <button id="micBtn" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg flex items-center gap-2 transition">
            <span id="micIcon">🎤</span><span id="micLabel">마이크 켜기</span>
          </button>
        </div>
      </main>

      <aside class="w-full md:w-80 bg-gray-800 flex flex-col border-t md:border-t-0 md:border-l border-gray-700 h-64 md:h-auto">
        <div class="px-4 py-3 border-b border-gray-700 font-semibold">💬 채팅</div>
        <div id="messages" class="chat-scroll flex-1 overflow-y-auto p-3 space-y-2 text-sm"></div>
        <div class="p-3 border-t border-gray-700 flex gap-2">
          <input id="chatInput" type="text" placeholder="메시지 입력..."
            class="flex-1 px-3 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 text-sm" />
          <button id="sendBtn" class="bg-blue-600 hover:bg-blue-500 px-3 rounded-lg text-sm">전송</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
